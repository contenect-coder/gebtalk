[build]
  publish = "gebtalk_flutter/build/web"

[[redirects]]
  from = "/api/*"
  to = "https://sharper-prevent-psychic.ngrok-free.dev/api/:splat"
  status = 200
  force = true
  headers = {Bypass-Tunnel-Reminder = "true", bypass-tunnel-reminder = "true", ngrok-skip-browser-warning = "true"}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
